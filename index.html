<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Scott’s TCG Binder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --text: #f3eee6;
      --muted: #c2b8aa;
      --card: #000;
      --border: #2a2a2a;
      --accent: #8ab4ff;
      --page: 800px;
      --logo: 420px;
    }
    html, body { background: #000; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: var(--text);
      line-height: 1.6;
    }
    .site-banner {
      width: 100%;
      max-width: var(--page);
      margin: 0 auto;
      background: #000;
      line-height: 0;
      padding: 1.25rem 1.25rem 0;
      box-sizing: border-box;
    }
    .site-banner img {
      display: block;
      width: 100%;
      max-width: var(--logo);
      height: auto;
      margin: 0 auto;
    }
    .site-nav {
      width: 100%;
      max-width: var(--page);
      margin: 0 auto;
      padding: 1rem 1.25rem 0;
      box-sizing: border-box;
      text-align: center;
    }
    .site-nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.35rem 1.25rem;
    }
    .site-nav li,
    .site-nav li + li {
      margin: 0;
      padding: 0;
    }
    .site-nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      line-height: 1.2;
      display: inline-block;
    }
    .site-nav a:hover,
    .site-nav a:focus-visible {
      text-decoration: underline;
      text-underline-offset: 0.14em;
    }
    .site-nav a[aria-current="page"] {
      color: var(--text);
    }
    main {
      max-width: var(--page);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      box-sizing: border-box;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.4rem;
    }
    a { color: var(--accent); }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <div class="site-banner" role="banner">
    <img src="/ScottsTCGBinderLicenses/assets/mobile_header.png" alt="Scott’s TCG Binder" width="2172" height="724" decoding="async">
  </div>
  <nav class="site-nav" aria-label="Site">
    <ul>
      <li><a href="/" aria-current="page">Home</a></li>
      <li><a href="/ScottsTCGBinderLicenses/privacy/">Privacy</a></li>
      <li><a href="/ScottsTCGBinderLicenses/support/">Support</a></li>
      <li><a href="/ScottsTCGBinderLicenses/terms/">Terms</a></li>
    </ul>
  </nav>
  <main>
    <section>
      <h1>Scott’s TCG Binder</h1>
      <p>Legal and support pages for Scott’s TCG Binder / Bindovo.</p>
      <ul>
        <li><a href="/ScottsTCGBinderLicenses/terms/">End User License Agreement</a></li>
        <li><a href="/ScottsTCGBinderLicenses/privacy/">Privacy Policy</a></li>
        <li><a href="/ScottsTCGBinderLicenses/support/">Support</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
