<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Support — Scott’s TCG Binder</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f4ef; --text:#1c1915; --muted:#5c564c; --card:#fffdf8; --border:#d9d2c5; --accent:#0b57d0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161412; --text:#f3eee6; --muted:#c2b8aa; --card:#221e1a; --border:#3a342c; --accent:#8ab4ff; }
    }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    .site-banner { width:100%; background:#071226; line-height:0; }
    .site-banner img { display:block; width:100%; max-width:1100px; height:auto; margin:0 auto; }
    main { max-width:720px; margin:0 auto; padding:2rem 1.25rem 3rem; }
    section { background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:1.4rem; }
    a { color:var(--accent); }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <div class="site-banner" role="banner">
    <img src="/ScottsTCGBinderLicenses/assets/mobile_header.png" alt="Scott’s TCG Binder" width="2172" height="724" decoding="async">
  </div>
  <main>
    <section>
      <h1>Scott’s TCG Binder Support</h1>
      <p>Scott’s TCG Binder is a local-first Pokémon TCG collection manager for Mac, iPhone, and iPad.</p>
      <p>For privacy questions, read the <a href="/ScottsTCGBinderLicenses/privacy/">Privacy Policy</a>.</p>
      <p class="muted">App Store support contact details appear on the product page when the application is listed.</p>
    </section>
  </main>
</body>
</html>
