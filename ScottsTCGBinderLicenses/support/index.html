<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Support — Scott’s TCG Binder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --text: #f3eee6;
      --muted: #c2b8aa;
      --card: #000;
      --border: #2a2a2a;
      --accent: #8ab4ff;
      --page: 1024px;
      --logo: 420px;
    }
    html, body { background: #000; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: var(--text);
      line-height: 1.6;
    }
    .site-banner {
      width: 100%;
      max-width: var(--page);
      margin: 0 auto;
      background: #000;
      line-height: 0;
      padding: 1.25rem 1.25rem 0;
      box-sizing: border-box;
    }
    .site-banner img {
      display: block;
      width: 100%;
      max-width: var(--logo);
      height: auto;
      margin: 0 auto;
    }
    main {
      max-width: var(--page);
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      box-sizing: border-box;
    }
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.4rem;
    }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="site-banner" role="banner">
    <img src="/ScottsTCGBinderLicenses/assets/mobile_header.png" alt="Scott’s TCG Binder" width="2172" height="724" decoding="async">
  </div>
  <main>
    <section>
      <h1>Scott’s TCG Binder Support</h1>
      <p>Scott’s TCG Binder is a local-first Pokémon TCG collection manager for Mac, iPhone, and iPad.</p>
      <p>For privacy questions, read the <a href="/ScottsTCGBinderLicenses/privacy/">Privacy Policy</a>.</p>
      <p class="muted">App Store support contact details appear on the product page when the application is listed.</p>
    </section>
  </main>
</body>
</html>
